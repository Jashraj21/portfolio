<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Kodak Yellow Base -->
  <rect width="64" height="64" rx="14" fill="#ffc72c"/>
  
  <!-- Kodak Red Corner Tab -->
  <path d="M0 0 H24 L0 24 Z" fill="#d90429"/>
  
  <!-- 35mm Film Frame Inner Border -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#12100d" stroke="#ffc72c" stroke-width="2"/>
  
  <!-- Film Sprocket Notches -->
  <rect x="12" y="11" width="5" height="4" rx="1" fill="#ffc72c"/>
  <rect x="22" y="11" width="5" height="4" rx="1" fill="#ffc72c"/>
  <rect x="37" y="11" width="5" height="4" rx="1" fill="#ffc72c"/>
  <rect x="47" y="11" width="5" height="4" rx="1" fill="#ffc72c"/>
  
  <rect x="12" y="49" width="5" height="4" rx="1" fill="#ffc72c"/>
  <rect x="22" y="49" width="5" height="4" rx="1" fill="#ffc72c"/>
  <rect x="37" y="49" width="5" height="4" rx="1" fill="#ffc72c"/>
  <rect x="47" y="49" width="5" height="4" rx="1" fill="#ffc72c"/>

  <!-- Camera Lens / Center Emblem -->
  <circle cx="32" cy="32" r="11" fill="#ffc72c"/>
  <circle cx="32" cy="32" r="8" fill="#d90429"/>
  <circle cx="32" cy="32" r="4" fill="#faf6ee"/>
</svg>